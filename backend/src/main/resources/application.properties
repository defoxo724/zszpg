spring.application.name=zszpg

# Baza MySQL uruchamiana przez run_mysql.sh.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zszpg}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root123}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Magazyn obrazów posiłków MinIO uruchamiany przez run_minio.sh.
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:meal-images}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Login superadmina
app.admin.login=admin

# Hasło superadmina
app.admin.password=admin123

# Cross originy dla aplikacji frontendowej
app.cors.allowed-origin=http://localhost:3000

# Walidacja danych logowania
app.auth.login.min_length=3
app.auth.login.max_length=50
app.auth.password.min_length=8
app.auth.password.max_length=72

# Walidacja posiłków i kategorii
app.meal.name.min_length=3
app.meal.name.max_length=100
app.meal.description.min_length=3
app.meal.description.max_length=255
app.meal_category.name.min_length=3
app.meal_category.name.max_length=100
